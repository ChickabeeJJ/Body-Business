<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b2631">
  <title>Body Business · Physics Test Room</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game"></div>

  <header class="topbar">
    <div class="brand"><b>BODY</b><b class="o">BUSINESS</b><small>PHASE 1 · PHYSICS PROOF · DRAG ANYTHING</small></div>
  </header>
  <nav class="actions">
    <button class="btn primary" data-act="reset"><b>RESET</b><kbd>R</kbd></button>
    <button class="btn" data-act="drop"><b>DROP</b><kbd>1</kbd></button>
    <button class="btn" data-act="launch"><b>LAUNCH</b><kbd>2</kbd></button>
    <button class="btn" data-act="spring"><b>ONTO SPRING</b><kbd>3</kbd></button>
    <button class="btn" data-act="rope"><b>TIE ROPE</b><kbd>4</kbd></button>
    <button class="btn" data-act="add"><b>+ EMPLOYEE</b><kbd>E</kbd></button>
    <button class="btn" data-act="type"><b>TYPE: STANDARD</b><kbd>Q</kbd></button>
    <button class="btn" data-act="walk" title="Experimental: can an employee walk under physics?"><b>WALK</b><kbd>W</kbd></button>
    <button class="btn" data-act="pause"><b>PAUSE</b><kbd>P</kbd></button>
    <button class="btn" data-act="debug"><b>DEBUG</b><kbd>D</kbd></button>
    <button class="btn test" data-act="test"><b>STRESS TEST</b><kbd>T</kbd></button>
  </nav>
  <aside id="panel" class="panel hidden"></aside>
  <section id="report" class="report hidden"></section>

  <script src="lib/phaser-3.90.0.min.js"></script>
  <script src="src/config.js"></script>
  <script src="src/levels.js"></script>
  <script src="src/art.js"></script>
  <script src="src/ragdoll.js"></script>
  <script src="src/actors.js"></script>
  <script src="src/testroom.js"></script>
  <script src="src/stress.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
